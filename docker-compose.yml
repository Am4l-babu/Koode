# Local / single-host deployment. Put a TLS-terminating reverse proxy
# (Caddy, Nginx, a cloud load balancer) in front of `app` in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-koode}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koode}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-koode}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-koode}?schema=public
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-koode}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-koode}?schema=public
      STORAGE_DIR: /app/storage/private
    ports:
      - "3000:3000"
    volumes:
      - documents:/app/storage/private
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  documents:
